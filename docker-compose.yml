services:
  postgres:
    image: postgres:16-alpine
    container_name: daryva-postgres
    environment:
      POSTGRES_DB: daryva
      POSTGRES_USER: daryva
      POSTGRES_PASSWORD: daryva_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daryva"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
