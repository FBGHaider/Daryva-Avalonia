services:
  postgres:
    image: postgres:16-alpine
    container_name: daryva-postgres
    environment:
      POSTGRES_DB: daryva
      POSTGRES_USER: daryva
      POSTGRES_PASSWORD: daryva_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daryva"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local SMTP catch-all for dev: matches Smtp:Server=localhost, Smtp:Port=1025 in
  # appsettings.Development.json. Every email the API sends lands here instead of a
  # real inbox -- view them at http://localhost:5001.
  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: daryva-smtp4dev
    ports:
      - "1025:25"
      - "5001:80"
    restart: unless-stopped

volumes:
  postgres_data:
