services:
  # Run with: docker compose run --rm migrate (uses image from CI; migrations run before new API is up)
  migrate:
    image: ${DARYVA_MIGRATE_IMAGE:-ghcr.io/daryva/daryva-api-migrate:latest}
    environment:
      ConnectionStrings__DefaultConnection: ${API_CONNECTION_STRING:?set_in_server_env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${DARYVA_API_IMAGE:-ghcr.io/your-org/daryva-api:latest}
    container_name: daryva-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${API_CONNECTION_STRING:?set_in_server_env}
      Jwt__Authority: ${JWT_AUTHORITY:-https://merry-marmoset-71.clerk.accounts.dev}
      Jwt__Audience: daryva-api
      Jwt__Issuer: daryva-api
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set_in_server_env}
      Jwt__AccessTokenMinutes: 30
      Jwt__RefreshTokenDays: 14
      Auth__AllowAnyLogin: "false"
      Auth__VerificationUrlBase: https://api.daryva.com/api/auth/verify-email
      Cors__AllowedOrigins__0: https://daryva.com
      Cors__AllowedOrigins__1: https://www.daryva.com
      Smtp__Server: ${SMTP_SERVER:?set_in_server_env}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:?set_in_server_env}
      Smtp__Password: ${SMTP_PASSWORD:?set_in_server_env}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:?set_in_server_env}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: daryva-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daryva}
      POSTGRES_USER: ${POSTGRES_USER:-daryva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_in_server_env}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daryva"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_prod_data:
