# daryva.com marketing site — production Nginx config
# Live on the VPS at /etc/nginx/sites-available/daryva-website
# Own Certbot-managed cert, covering daryva.com + www.daryva.com.
# Separate from daryva-api.conf's cert (api.daryva.com) — the two
# are issued and renewed independently.
#
# Static files land here via .github/workflows/deploy-website.yml,
# which rsyncs site/dist/ to this root over SSH on every push to
# site/**.

server {
    server_name daryva.com www.daryva.com;

    root /var/www/daryva.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/daryva.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/daryva.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.daryva.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = daryva.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name daryva.com www.daryva.com;
    return 404; # managed by Certbot
}
