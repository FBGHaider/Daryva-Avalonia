# Daryva production Nginx config
# Assumptions:
# - Website is served by your web host/build at daryva.com
# - API is running in Docker on same VPS and exposed at 127.0.0.1:8080

server {
    listen 80;
    listen [::]:80;
    server_name daryva.com www.daryva.com api.daryva.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name daryva.com www.daryva.com;

    ssl_certificate /etc/letsencrypt/live/daryva.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daryva.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Replace this with your actual web root/build output if self-hosted.
    root /var/www/daryva.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.daryva.com;

    ssl_certificate /etc/letsencrypt/live/daryva.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daryva.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
