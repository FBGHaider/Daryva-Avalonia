# Daryva Tenant Portal — production Nginx config
# Live on the VPS at /etc/nginx/sites-available/daryva-portal
# Own Certbot-managed cert, scoped to portal.daryva.com only.

server {
    server_name portal.daryva.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/portal.daryva.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/portal.daryva.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = portal.daryva.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name portal.daryva.com;
    return 404; # managed by Certbot
}
